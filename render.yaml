# Despliegue de Nomira en Render (https://render.com) con «New > Blueprint».
# Planes de PAGO: servicio siempre encendido, disco permanente para los archivos que suben los
# despachos (montado en /datos) y base de datos sin caducidad con recuperación a un punto en el tiempo.
# Los nombres de plan son los identificadores de Render (https://render.com/docs/blueprint-spec).
services:
  - type: web
    name: nomira-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    plan: 0.5c-512mb
    # Archivos subidos (expedientes, evidencia, comprobantes). STORAGE_DIR=/datos/almacen (Dockerfile).
    disk:
      name: nomira-archivos
      mountPath: /datos
      sizeGB: 5
    healthCheckPath: /api/salud  # pasa por Next y comprueba API y base de datos
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nomira-db
          property: connectionString
      - key: JWT_SECRETO
        generateValue: true
      - key: ENTORNO
        value: produccion
      - key: PERMITIR_REGISTRO
        value: "false"
      - key: SEMBRAR_DEMO
        value: "true"
      # Contraseña PRIVADA (12+ caracteres) de las cuentas demo (admin/analista/consulta@demo.local).
      # La de ejemplo del README está publicada: en producción nunca abre nada. Sin esta variable,
      # las cuentas demo se desactivan.
      - key: DEMO_CONTRASENA
        sync: false
      - key: ZONA_HORARIA
        value: America/Mexico_City
      # Panel de la plataforma (/plataforma): su primer administrador se crea al arrancar con estos
      # datos. Se capturan en Render > nomira-demo > Environment (no se guardan en el repositorio).
      - key: PLATAFORMA_ADMIN_EMAIL
        sync: false
      - key: PLATAFORMA_ADMIN_CONTRASENA
        sync: false
      # Botón de WhatsApp del sitio público: número con lada de país, p. ej. 5215512345678.
      - key: WHATSAPP_CONTACTO
        sync: false
      # Correos (bienvenida y recordatorio de vencimiento). CORREO_PROVEEDOR=resend (funciona en el
      # plan gratuito, por HTTPS) o smtp (Render solo deja salir por SMTP en planes de pago).
      # Vacío = no se envía nada. Las claves se capturan en Render > nomira-demo > Environment.
      - key: URL_PUBLICA
        value: https://nomirasoft.com
      - key: CORREO_PROVEEDOR
        sync: false
      - key: CORREO_REMITENTE
        value: Nomira <hola@nomirasoft.com>
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PUERTO
        value: "465"
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_CONTRASENA
        sync: false
      - key: RECORDATORIO_DIAS
        value: "7"
      # Nomira AFORE. La clave de cifrado se genera una vez y NO debe cambiarse (CURP/NSS/tokens cifrados).
      - key: AFORE_CLAVE_CIFRADO
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: CURP_API_URL
        sync: false
      - key: CURP_API_KEY
        sync: false
      # Verificación opcional con IA. Para activarla: IA_HABILITADA=true y su clave en ANTHROPIC_API_KEY
      # (Render > nomira-demo > Environment). Envía imágenes de recibos al proveedor de IA.
      - key: IA_HABILITADA
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      # Módulo Comercial: pago con tarjeta por Stripe Checkout. STRIPE_MODO=prueba (sk_test_/rk_test_) o
      # real (rk_live_/sk_live_); si la llave no coincide con el modo, no se cobra. Vacío = pendiente.
      - key: STRIPE_MODO  # prueba (por defecto) | real
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Render pone Cloudflare delante; este encabezado lo fija Cloudflare y no se puede falsificar
      # (X-Forwarded-For sí: Render no lo limpia).
      - key: IP_CLIENTE_ENCABEZADO
        value: True-Client-IP

databases:
  - name: nomira-db
    plan: 0.1c-256mb
