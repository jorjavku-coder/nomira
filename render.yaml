# Despliegue de DEMOSTRACIÓN en Render (https://render.com) con un clic: «New > Blueprint».
# Plan gratuito: el servicio se duerme tras unos minutos sin uso (el primer acceso tarda ~1 min),
# el disco es temporal y la base de datos gratuita caduca a los 30 días. No lo use con datos reales.
services:
  - type: web
    name: nomira-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nomira-db
          property: connectionString
      - key: JWT_SECRETO
        generateValue: true
      - key: ENTORNO
        value: produccion
      - key: PERMITIR_REGISTRO
        value: "false"
      - key: SEMBRAR_DEMO
        value: "true"
      - key: ZONA_HORARIA
        value: America/Mexico_City
      # Verificación opcional con IA. Para activarla: IA_HABILITADA=true y su clave en ANTHROPIC_API_KEY
      # (Render > nomira-demo > Environment). Envía imágenes de recibos al proveedor de IA.
      - key: IA_HABILITADA
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: nomira-db
    plan: free
